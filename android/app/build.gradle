apply plugin: 'com.android.application'

android {
    namespace = "ai.haheho.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Two store apps from one codebase. Everything native (permissions,
    // plugins, MainActivity, web config) lives in src/main and is shared;
    // a flavor only sets what must differ per store listing: app ID,
    // name/icons (src/<flavor>/res) and the extra user-agent tag.
    // Build commands: see README "Two apps".
    buildFeatures {
        buildConfig = true
    }
    flavorDimensions = ["app"]
    productFlavors {
        haheho {
            // Main app for all programs.
            dimension "app"
            applicationId "ai.haheho.app"           // PERMANENT after first store upload — do not change
            buildConfigField "String", "USER_AGENT_TAG", '""'
        }
        inpatient {
            // Hospital inpatients only, separate store listing.
            dimension "app"
            applicationId "ai.haheho.inpatient"     // PERMANENT once uploaded — confirm before first upload
            buildConfigField "String", "USER_AGENT_TAG", '"HahehoInpatient"'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'

        // Push (Firebase project haheho-mobile-temp — the one the server's FCM key is from).
        // google-services.json lists every app ID registered in that project. Until an app
        // (flavor) is registered there, skip its google-services step so it still builds;
        // push just isn't available in that app yet.
        def registered = new groovy.json.JsonSlurper().parse(servicesJSON).client
            .collect { it.client_info.android_client_info.package_name }
        android.applicationVariants.all { variant ->
            if (!registered.contains(variant.applicationId)) {
                logger.warn("google-services.json has no app ${variant.applicationId}: push disabled in ${variant.name}")
                tasks.matching { it.name == "process${variant.name.capitalize()}GoogleServices" }
                    .configureEach { enabled = false }
            }
        }
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
